        let q = Math.floor(L / 255 * STEPS + (BAYER[by + (x & 3)] + 0.5) / 16) / STEPS;

  /* ------------------------------------------------------------------ sprites in the world */
  function playerFrame(s) {

  function drawPlayer(ctx, s, camX, camY, pass, flash) {
    const [name, idx] = playerFrame(s);

    const fx = Math.round(s.x + 2.5 - camX), fy = Math.round(s.y + s.h - camY);

  }

  function drawTether(ctx, c, s, camX, camY, time) {
    const sh = SHEETS.tether;
    const active = c.i <= s.cp;
    let idx;
    if (!active) idx = 0 + Math.floor(time * 3) % 2 * 0;
    else {
      const t = (Gm_timeSince(c.i) || 99);
      idx = t < 6 * 0.083 * 3 ? 2 + Math.floor(t / (0.083 * 3)) : 8 + Math.floor(time * 12) % 16;
    }

  }
  let tetherT = {};
  function Gm_timeSince(i) { return tetherT[i]; }
  function markTether(i, time) { tetherT[i] = 0; tetherT['_' + i] = time; }
  function tickTethers(dt) { for (const k in tetherT) if (k[0] !== '_') tetherT[k] += dt; }

  function drawLampCrystal(ctx, w, l, camX, camY, time, post) {
    const x = Math.round(l.x - camX), y = Math.round(l.y - camY);
    const k = Math.max(0.15, l.k);
    if (!post) {
      // vine from the ceiling
      let top = 0; const tx = Math.floor(l.x / TS), ty = Math.floor(l.y / TS);
      while (top < 16 && !D.solidAt(w, tx, ty - top - 1)) top++;
      if (top > 0 && top < 16) {
        ctx.fillStyle = '#10131a'; ctx.fillRect(x, y - top * TS, 1, top * TS - 2);
        ctx.fillStyle = '#1c2230'; ctx.fillRect(x + 1, y - top * TS, 1, Math.max(0, top * TS - 6));
      }

    }

    const f = 0.75 + 0.25 * k;
    ctx.fillStyle = '#3c5d6b'; ctx.fillRect(x - 2, y - 2, 5, 5);
    ctx.fillStyle = PAL.cold1; ctx.fillRect(x - 1, y - 3, 3, 6);
    ctx.fillStyle = PAL.cold2; ctx.fillRect(x - 1, y - 2, 2, 4);
    ctx.globalAlpha = f; ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 2, 1, 2); ctx.globalAlpha = 1;
  }

  function drawOrb(ctx, l, camX, camY, time) {
    const x = Math.round(l.x - camX), y = Math.round(l.y - camY);
    drawFrame(ctx, SHEETS.orb, Math.floor(time * 12 + l.id) % 8, x, y + 24, false);
  }

  function drawWatcher(ctx, l, camX, camY, time, post, caught, S) {
    const x = Math.round(l.x - camX), y = Math.round(l.y - camY);
    if (!post) {
      drawFrame(ctx, SHEETS.voidBody, 0, x, y, false);
      return;
    }

    drawFrame(ctx, sh, 0, x, y, false);

    let ang = l.ang, hot = 0;

    const px = x + Math.round(Math.cos(ang) * 3), py = y + Math.round(Math.sin(ang) * 3);

      ctx.globalCompositeOperation = 'lighter';
      const gr = ctx.createRadialGradient(px, py, 0, px, py, 14);
      gr.addColorStop(0, 'rgba(255,235,200,' + (0.75 * hot * pulse).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(255,200,140,0)');
      ctx.fillStyle = gr; ctx.fillRect(px - 14, py - 14, 28, 28);
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = '#fff'; ctx.fillRect(px - 2, py - 2, 5, 5);

    }

    ctx.globalAlpha = 0.6; ctx.fillStyle = PAL.cold3; ctx.fillRect(px - 2, py - 1, 5, 3); ctx.globalAlpha = 1;
  }

  function drawBeamEmitter(ctx, l, camX, camY, time) {
    const k = l.k;
    const cx = l.x - camX, cy = l.y - camY;
    ctx.save();
    ctx.translate(Math.round(cx), Math.round(cy));
    // slit glows according to gain
    const a = 0.25 + 0.75 * Math.min(1, k * 4);
    ctx.globalAlpha = a;
    ctx.fillStyle = k > 0.5 ? '#fff' : PAL.cold1;
    if (Math.abs(l.dx) < 0.5) ctx.fillRect(-Math.round(l.w / 2), -1, Math.round(l.w), 2);

    ctx.restore(); ctx.globalAlpha = 1;
  }

  /* The prismatic crystal: faceted, each facet drifting through the spectrum. */
  function hsl(h, s, l, a) { return 'hsla(' + Math.round(h % 360) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a) + ')'; }
  function drawCrystal(ctx, g, camX, camY, time, burst) {
    const x = Math.round(g.x - camX), y = Math.round(g.y - camY) + Math.round(Math.sin(time * 2.1) * 1.5);
    const pts = [[0, -11], [5, -3], [4, 7], [0, 10], [-4, 7], [-5, -3]];
    const facets = [[0, 1, 3], [0, 3, 5], [0, 5, 4], [1, 2, 3], [3, 4, 5], [4, 5, 0]];
    const base = time * 60;
    const sc = burst ? 1 + burst * 0.6 : 1;

  /* ------------------------------------------------------------------ the whole scene */
  function drawBackground(ctx, w, camX, camY, W, H, time) {
    // depth tint: cold at the top, violet-teal in the deep

    const top = [38, 48, 66], bot = [40, 38, 66];
    const r = Math.round(top[0] + (bot[0] - top[0]) * depth), g = Math.round(top[1] + (bot[1] - top[1]) * depth), b = Math.round(top[2] + (bot[2] - top[2]) * depth);

      const L = bgLayers[i];

  function drawTerrain(ctx, w, camX, camY, W, H) {
    const cx0 = Math.floor(camX / (CH * TS)), cx1 = Math.floor((camX + W) / (CH * TS));

    }
  }

  function drawDecorBack(ctx, w, camX, camY, W, H, time) {
    const x0 = Math.floor(camX / TS) - 2, x1 = Math.floor((camX + W) / TS) + 2;
    // frost tufts: use pale ice-prop frames from the tileset-free procedural shapes
    for (const f of decor.floor) {

      const px = f.x * TS - camX, py = (f.y + 1) * TS - camY;

  function drawHints(ctx, w, camX, camY, W, H, Gm) {

        const y = Math.round(top + sw);

        ctx.fillStyle = '#040408'; ctx.fillRect(x, y, 1, bot - y);
        ctx.fillStyle = '#0c0b14'; ctx.fillRect(x, y, 1, 1);
        const dr = Math.sin(wx * 0.13 + time * 0.7) + Math.sin(wx * 0.31 - time * 0.4);
        if (dr > 1.55) { ctx.fillStyle = '#0a0a12'; ctx.fillRect(x, y + 2, 1, 3); }
      }
      if (post) continue;
      // bubbles
      const n = Math.ceil((k[2] - k[0]) / 40);
      for (let i = 0; i < n; i++) {
        const per = 2.2 + hash2(i, 7) * 2.5, ph = (time / per + hash2(i, 3)) % 1;
        const bx = Math.round(k[0] + (i + hash2(i, 11)) * (k[2] - k[0]) / n - camX);

        const by = Math.round(top + 6 - ph * 8);
        if (ph < 0.8) {
          const r = ph < 0.4 ? 1 : 2;
          ctx.fillStyle = '#14141f'; ctx.fillRect(bx - r, by - r, r * 2 + 1, r * 2 + 1);
          ctx.fillStyle = '#3a3a52'; ctx.fillRect(bx - r + 1, by - r, 1, 1);
        } else {
          ctx.fillStyle = '#2a2a3c'; ctx.fillRect(bx - 2, Math.round(top) - 1, 1, 1); ctx.fillRect(bx + 2, Math.round(top) - 1, 1, 1);
        }
      }
    }
  }

  function drawScene(ctx, Gm, camX, camY, W, H) {

      else if (l.t === 'watch') drawWatcher(ctx, l, camX, camY, time, true, s.dead ? 0 : D.lightAt(w, l, s.x + 2.5, s.y + s.h * 0.5) * 3, s);
      else if (l.t === 'lamp' && l.col !== 'rainbow') drawLampCrystal(ctx, w, l, camX, camY, time, true);
      else if (l.t === 'beam') drawBeamEmitter(ctx, l, camX, camY, time);
    }
    if (!s.dead && !(s.won && s.wonT > 30)) {
      // only the visor stays visible in shadow
      const vis = 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(time * 5.0));
      ctx.globalAlpha = s.ex > 0.05 ? Math.min(1, vis + s.ex) : vis;
      drawPlayer(ctx, s, camX, camY, 'visor', 0);
      ctx.globalAlpha = 1;
    }
    // coloured glow over the lit scene
    ctx.globalCompositeOperation = 'lighter';
    for (const l of w.lights) {
      if (l.x < camX - l.reach || l.x > camX + W + l.reach || l.y < camY - l.reach || l.y > camY + H + l.reach) continue;
      if (l.t === 'lamp' || l.t === 'orb') {
        if (l.k < 0.02) continue;
        const gr = ctx.createRadialGradient(l.x - camX, l.y - camY, 0, l.x - camX, l.y - camY, l.r * 0.5);
        gr.addColorStop(0, 'rgba(120,190,220,' + (0.16 * l.k * l.I).toFixed(3) + ')'); gr.addColorStop(1, 'rgba(120,190,220,0)');
        ctx.fillStyle = gr; ctx.fillRect(l.x - l.r * 0.5 - camX, l.y - l.r * 0.5 - camY, l.r, l.r);
      }
    }
    ctx.globalCompositeOperation = 'source-over';
    // the crystal and its rainbow
    const g = w.goal;
    if (g.x > camX - 150 && g.x < camX + W + 150) {
      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 7; i++) {
        const a = time * 0.6 + i * (Math.PI * 2 / 7);
        const gr = ctx.createRadialGradient(g.x - camX, g.y - camY, 0, g.x - camX + Math.cos(a) * 22, g.y - camY + Math.sin(a) * 14, 70);
        gr.addColorStop(0, hsl(i * 51 + time * 40, 70, 60, 0.20)); gr.addColorStop(1, hsl(i * 51 + time * 40, 70, 60, 0));
        ctx.fillStyle = gr; ctx.fillRect(g.x - camX - 90, g.y - camY - 90, 180, 180);
      }
      ctx.globalCompositeOperation = 'source-over';
      drawCrystal(ctx, g, camX, camY, time, s.won ? Math.min(1, s.wonT / 60) : 0);
    }
  }

</script>
<script>/* DWELLER — procedural music and sound, all synthesised with Web Audio (no samples).
 *
 * Tuning: every pitch is 48 Hz x X / 2^N (the Seeker tuning). The palette is 1, 9/8, 19/16, 21/16, 3/2, 7/4.
 * Tempo: 90 BPM = 1.5 Hz; one step (a half beat) = 32 simulation ticks at 96 Hz.
 * Motifs of 5 and 7 steps run against each other and realign every 35 steps.
 * The same engine drives the live game (reacting to light and danger) and the offline render of the soundtrack.
 */
(function (global) {
  'use strict';
  const F0 = 48;
  const PALETTE = [1, 9 / 8, 19 / 16, 21 / 16, 3 / 2, 7 / 4];
  const BEAT = 60 / 90;
  const STEP = BEAT / 2;

  function hz(ratio, oct) { return F0 * ratio * Math.pow(2, oct); }
  function fold(f, lo, hi) { while (f < lo) f *= 2; while (f >= hi) f /= 2; return f; }
  function mulberry(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

  function makeIR(ctx, seconds, decay, seed) {
    const rate = ctx.sampleRate, n = Math.floor(rate * seconds);
    const buf = ctx.createBuffer(2, n, rate);
    const rnd = mulberry(seed || 7);

      for (let i = 0; i < n; i++) {

  function noiseBuffer(ctx, seconds, seed) {

    /* chord pad: swap voices when the root changes */
    setRoot(t, idx) {

      const r = PALETTE[idx];

    /* continuous parameters; call often (cheap) */
    setParams(t, p) {

    env(g, t, a, peak, d) {

    bell(t, f, vel, dur) {

    pluckBass(t, f, vel, dur) {

        case 'land': this.sfxNoise(t, 0.16, 'lowpass', 600, 120, 0.22 * v, 0.7); this.sfxTone(t, 90, 48, 0.2, 0.18 * v); break;
        case 'step': this.sfxNoise(t, 0.05, 'bandpass', 900 + 400 * this.rnd(), 500, 0.05 * v, 2); break;
        case 'roll': this.sfxNoise(t, 0.36, 'bandpass', 380, 1100, 0.16 * v, 1.6); break;
        case 'wjump': this.sfxNoise(t, 0.1, 'highpass', 1800, 900, 0.10 * v, 1); this.sfxTone(t, 260, 480, 0.14, 0.08 * v, 'triangle'); break;
        case 'death': {
          this.sfxTone(t, 380, 48, 1.4, 0.34, 'sawtooth'); this.sfxNoise(t, 1.1, 'lowpass', 2400, 90, 0.34, 0.8);
          this.sfxTone(t, F0 * 19, F0 * 19 * 0.5, 1.0, 0.12); this.sfxTone(t, F0 * 21, F0 * 21 * 0.5, 1.0, 0.12); break;
        }
        case 'respawn': { for (let i = 0; i < 3; i++) this.bell(t + i * 0.09, F0 * 8 * PALETTE[[0, 4, 5][i]] * 0.5 * 2, 0.5, 1.8); break; }
        case 'check': { const seq = [1, 3 / 2, 2, 7 / 4, 3, 7 / 2]; seq.forEach((r, i) => this.bell(t + i * 0.12, F0 * 8 * r, 0.7, 3.2)); this.sfxNoise(t, 0.6, 'bandpass', 300, 2400, 0.09, 1.5); break; }
        case 'beamOn': this.sfxTone(t, 160, 70, 0.28, 0.16 * v, 'sine'); this.sfxNoise(t, 0.22, 'highpass', 3600, 2200, 0.05 * v, 0.7); break;

    }
  }

  /* ------------------------------------------------------------------ live game wrapper */
  const Live = {
    ctx: null, eng: null, started: false, muted: false, timer: null, nextStep: 0, stepN: 0, t0: 0, params: { energy: 0.2, fear: 0 },
    init() {
      if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return true; }
      const AC = global.AudioContext || global.webkitAudioContext;
      if (!AC) return false;
      try {
        this.ctx = new AC({ latencyHint: 'interactive' });
        this.eng = new Engine(this.ctx, this.ctx.destination, { volume: 0.7 });
        this.eng.setParams(this.ctx.currentTime, { energy: 0.2, fear: 0 });
        this.eng.setRoot(this.ctx.currentTime, 0);
        this.started = true;
        this.t0 = this.ctx.currentTime;
        this.stepN = 0; this.nextStep = this.ctx.currentTime + 0.1;
        this.timer = setInterval(() => this.pump(), 30);
      } catch (e) { this.ctx = null; return false; }
      return true;
    },
    pump() {
      const c = this.ctx; if (!c || c.state !== 'running' || this.paused) return;
      const horizon = c.currentTime + 0.25;
      let guard = 0;
      while (this.nextStep < horizon && guard++ < 8) {
        if (this.nextStep < c.currentTime - 0.5) { this.nextStep = c.currentTime + 0.05; }
        this.eng.step(this.nextStep, this.stepN, this.params);
        this.nextStep += STEP; this.stepN++;
      }
    },
    setMood(e, rootIdx) {
      if (!this.eng) return;
      this.params.energy = e;
      this.eng.setRoot(this.ctx.currentTime + 0.05, rootIdx);
    },
    update(fear, duck) {
      if (!this.eng) return;
      this.params.fear = fear;
      this.eng.setParams(this.ctx.currentTime, { energy: this.params.energy, fear, duck: this.muted ? 0 : (duck === undefined ? 1 : duck) });
    },
    sfx(name, a) { if (this.eng && !this.muted && this.ctx.state === 'running') this.eng.sfx(name, this.ctx.currentTime + 0.005, a); },
    setPaused(p) { this.paused = p; if (this.ctx) { if (p) this.eng.setParams(this.ctx.currentTime, { energy: this.params.energy, fear: 0, duck: 0.35 }); } },
    toggleMute() { this.muted = !this.muted; if (this.eng) this.eng.master.gain.setTargetAtTime(this.muted ? 0 : 0.7, this.ctx.currentTime, 0.1); return this.muted; },
  };

  /* ------------------------------------------------------------------ offline soundtrack render */
  // arrangement: [seconds, energy, rootIdx]
  const ARRANGEMENT = [[0, 0.12, 0], [24, 0.22, 0], [48, 0.34, 4], [72, 0.46, 2], [96, 0.58, 5], [120, 0.72, 1], [144, 0.86, 3], [168, 1.0, 0], [200, 0.66, 4], [224, 0.30, 0], [248, 0.12, 0]];
  async function renderTrack(seconds, sampleRate) {
    const OAC = global.OfflineAudioContext || global.webkitOfflineAudioContext;
    const rate = sampleRate || 44100;
    const ctx = new OAC(2, Math.floor(seconds * rate), rate);
    const eng = new Engine(ctx, ctx.destination, { offline: true, volume: 0.7, seed: 48 });
    let ai = 0;
    const steps = Math.floor(seconds / STEP);
    let lastParam = -1;
    for (let n = 0; n < steps; n++) {
      const t = n * STEP;
      while (ai + 1 < ARRANGEMENT.length && ARRANGEMENT[ai + 1][0] <= t) ai++;
      const a = ARRANGEMENT[ai], b = ARRANGEMENT[Math.min(ARRANGEMENT.length - 1, ai + 1)];
      const k = b[0] > a[0] ? Math.min(1, (t - a[0]) / (b[0] - a[0])) : 0;
      const e = a[1] + (b[1] - a[1]) * k * k * (3 - 2 * k);
      if (n === 0 || a[2] !== eng.rootIdx) eng.setRoot(t, a[2]);
      const fear = e > 0.8 ? 0.35 + 0.25 * Math.sin(t * 0.7) : 0.05;
      if (t - lastParam >= 0.5) { eng.setParams(t, { energy: e, fear }); lastParam = t; }
      eng.step(t, n, { energy: e });
    }
    // closing chime
    eng.sfx('check', seconds - 14);

      const fx = Math.floor(cxp), fy = Math.floor(cyp);
      ox = (cxp - fx) * SC; oy = (cyp - fy) * SC;
      R.drawScene(ctx, { w: world, s: S, time: gameTime }, fx, fy, LW, LH);
      drawHUD(ctx);
    }
    // blit
    gctx.imageSmoothingEnabled = false;
    gctx.fillStyle = '#000'; gctx.fillRect(0, 0, canvas.width, canvas.height);
    gctx.drawImage(off, 0, 0, LW, LH, Math.round(-ox), Math.round(-oy), LW * SC, LH * SC);
  }

  function drawHUD(ctx) {
    const S_ = S;
    // exposure vignette & bar
    if (S_.ex > 0.02 && !S_.dead) {
      const e = Math.min(1, S_.ex);
      const gr = ctx.createRadialGradient(LW / 2, LH / 2, LH * 0.35, LW / 2, LH / 2, LH * 0.95);
      gr.addColorStop(0, 'rgba(230,240,255,0)'); gr.addColorStop(1, 'rgba(230,240,255,' + (0.5 * e * e).toFixed(3) + ')');
      ctx.fillStyle = gr; ctx.fillRect(0, 0, LW, LH);
    }
    if (flash > 0) { ctx.globalAlpha = Math.min(1, flash) * 0.5; ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1; }
    if (S_.dead) {
      const k = Math.min(1, S_.deadT / 60) * (S_.deadT > D.C.DEADT - 30 ? Math.max(0, (D.C.DEADT - S_.deadT) / 30) : 1);
      ctx.globalAlpha = k * 0.85; ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = 1;
      if (S_.deadT > 20) { ctx.globalAlpha = Math.min(1, (S_.deadT - 20) / 20) * k; R.drawText(ctx, S_.why === 'void' ? 'THE DARK TOOK YOU' : 'THE LIGHT FOUND YOU', LW >> 1, (LH >> 1) - 4, PAL.muted, 1, 'center'); ctx.globalAlpha = 1; }
    }
    // exposure bar above player
    if (S_.ex > 0.04 && !S_.dead) {
      const px = Math.round(S_.x + 2.5 - camX), py = Math.round(S_.y - 7 - camY);
      drawBar(ctx, px - 8, py, 16, 2, Math.min(1, S_.ex), S_.ex > 0.7 ? '#e8e0d0' : '#a9c4d2');
    }
    // section card
    if (cardT < 4.5 && mode !== 'win') {
      const a = Math.min(1, cardT / 0.8) * Math.min(1, (4.5 - cardT) / 1.0);
      ctx.globalAlpha = a * 0.9;
      R.drawText(ctx, cardText, LW >> 1, Math.round(LH * 0.22), PAL.snow, 2, 'center');
      ctx.globalAlpha = 1;
    }
    // small timer (top right) while playing
    if (mode === 'play') {
      ctx.globalAlpha = 0.5;
      R.drawText(ctx, fmtTime(runTicks / D.TICK), LW - 6, Math.round(44 / SC), PAL.muted, 1, 'right');
      ctx.globalAlpha = 1;
    }
    if (mode === 'pause') {
      ctx.fillStyle = 'rgba(5,5,10,0.7)'; ctx.fillRect(0, 0, LW, LH);
      R.drawText(ctx, 'PAUSED', LW >> 1, (LH >> 1) - 22, PAL.snow, 2, 'center');
      R.drawText(ctx, touchMode ? 'TAP TO RESUME' : 'ESC  RESUME', LW >> 1, (LH >> 1) + 2, PAL.gold, 1, 'center');
      R.drawText(ctx, touchMode ? 'TAP LOWER SCREEN  NEW DESCENT' : 'N  NEW DESCENT', LW >> 1, (LH >> 1) + 44, PAL.snow, 1, 'center');
      R.drawText(ctx, 'TIME  ' + fmtTime(runTicks / D.TICK) + '    DEATHS  ' + S_.deaths, LW >> 1, (LH >> 1) + 16, PAL.muted, 1, 'center');
      R.drawText(ctx, 'M  MUTE   F  FULLSCREEN   R  RETURN TO TETHER', LW >> 1, (LH >> 1) + 30, PAL.stone4, 1, 'center');
    }
    if (mode === 'win') {
      const a = Math.min(1, Math.max(0, (winT - 1.2) / 1.5));
      ctx.globalAlpha = a * 0.55; ctx.fillStyle = '#05050a'; ctx.fillRect(0, 0, LW, LH); ctx.globalAlpha = a;
      R.drawText(ctx, 'THE CRYSTAL', LW >> 1, Math.round(LH * 0.2), PAL.snow, 2, 'center');
      R.drawText(ctx, 'LEVEL I  THE DESCENT  COMPLETE', LW >> 1, Math.round(LH * 0.2) + 22, PAL.gold, 1, 'center');
      const t = runTicks / D.TICK;
      R.drawText(ctx, 'TIME  ' + fmtTime(t) + '     LIGHT FOUND YOU  ' + S_.deaths + ' TIMES', LW >> 1, Math.round(LH * 0.2) + 38, PAL.snow, 1, 'center');
      if (bestTime) R.drawText(ctx, 'BEST  ' + fmtTime(bestTime), LW >> 1, Math.round(LH * 0.2) + 50, PAL.muted, 1, 'center');
      if (winT > 3) { ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(winT * 3)); R.drawText(ctx, touchMode ? 'TAP FOR TITLE' : 'ENTER  TITLE     N  NEW DESCENT', LW >> 1, Math.round(LH * 0.2) + 68, PAL.gold, 1, 'center'); }
      ctx.globalAlpha = 1;
    }
  }

  function showError(msg) {
    const el = document.getElementById('err');
    if (el) { el.style.display = 'block'; el.textContent = 'Dweller hit a snag:\n' + msg.slice(0, 600) + '\n\nTry reloading the page.'; }
  }

  /* ------------------------------------------------------------ boot */
  async function boot() {
    resize();
    canvas.tabIndex = 0; canvas.style.outline = 'none'; grabFocus();
    buildTouchUI();
    loadSave();
    const q = new URLSearchParams(location.search);
    try {
      await R.load(window.DWELLER_ASSETS);
      world = D.makeWorld(window.DWELLER_LEVEL);
      R.prepare(world);
      S = D.newState(world); snapCamera();
    } catch (e) { showError(String(e && e.stack || e)); console.error(e); return; }
    const ld = document.getElementById('loading'); if (ld) ld.remove();
    mode = 'title'; titleT = 0;
    if (q.get('speed')) speedMul = Math.max(1, Math.min(32, parseFloat(q.get('speed')) || 1));
    lastT = performance.now();
    requestAnimationFrame(frame);
    // debug / test hooks
    window.__dweller = {
      get state() { return S; }, get world() { return world; }, get mode() { return mode; },
      start(fresh) { startGame(!!fresh); },
      replay(inputs, speed) { replay = inputs; replayI = 0; speedMul = speed || 1; },
      setSpeed(v) { speedMul = v; },
      teleport(x, y) { S.x = x; S.y = y; snapCamera(); },
      shot() { return canvas.toDataURL('image/png'); },
      get ticks() { return runTicks; },
    };
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
